services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./services/backend
    ports:
      - "8000:8000"
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql://postgres:postgres@db:5432/finance_db
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on:
      - db

  worker:
    build:
      context: ./services/worker
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql://postgres:postgres@db:5432/finance_db
    depends_on:
      - db

  ai-agent:
    build:
      context: ./services/ai-agent
    ports:
      - "8001:8000"
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql://postgres:postgres@db:5432/finance_db
      AWS_REGION: us-east-1
      # Note: Local invocations of Bedrock will require AWS credentials mounted 
      # or configured via AWS CLI on the host. In EKS, IRSA handles this transparently.
    depends_on:
      - db

  frontend:
    build:
      context: ./services/frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
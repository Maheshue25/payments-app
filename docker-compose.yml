services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./services/backend
    ports:
      - "8000:8000"
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql://postgres:postgres@db:5432/finance_db
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on:
      - db

  worker:
    build:
      context: ./services/worker
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql://postgres:postgres@db:5432/finance_db
    depends_on:
      - db

  frontend:
    build:
      context: ./services/frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
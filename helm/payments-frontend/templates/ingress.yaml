{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "payments-frontend.fullname" . }}-unified
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "payments-frontend.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn | quote }}
    external-dns.alpha.kubernetes.io/hostname: "{{ .Values.ingress.domain }},www.{{ .Values.ingress.domain }}"
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - host: {{ .Values.ingress.domain | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: payments-backend
                port:
                  number: 8000
          - path: /agent
            pathType: Prefix
            backend:
              service:
                name: support-ai-agent
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "payments-frontend.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
    - host: "www.{{ .Values.ingress.domain }}"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: payments-backend
                port:
                  number: 8000
          - path: /agent
            pathType: Prefix
            backend:
              service:
                name: support-ai-agent
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "payments-frontend.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
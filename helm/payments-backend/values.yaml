replicaCount: 3

image:
  repository: 987078319553.dkr.ecr.us-east-1.amazonaws.com/payments-backend
  pullPolicy: Always
  tag: "latest"

env:
  atabaseUrl: "postgresql://postgres:postgres@payments-db.payments.svc.cluster.local:5432/finance_db"
  corsOrigins: "https://erothi.online,https://www.erothi.online,http://localhost:8080,http://localhost:5173"
readinessProbe:
  httpGet:
    path: /healthz
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /healthz
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP
  port: 8000
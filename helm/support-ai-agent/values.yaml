replicaCount: 2

image:
  repository: 987078319553.dkr.ecr.us-east-1.amazonaws.com/support-ai-agent
  pullPolicy: IfNotPresent
  tag: "bc6ede7"

serviceAccount:
  create: true
  name: support-ai-agent-sa
  annotations:
    # Populated from Terraform output: aws_iam_role.ai_agent_irsa.arn
    eks.amazonaws.com/role-arn: "arn:aws:iam::987078319553:role/payments-production-eks-support-ai-agent-role"

env:
  awsRegion: "us-east-1"

readinessProbe:
  httpGet:
    path: /agent/ready
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 2

livenessProbe:
  httpGet:
    path: /agent/healthz
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 2

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1536Mi

service:
  type: ClusterIP
  port: 8000
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /agent/healthz

metrics:
  enabled: true
  path: /agent/metrics
  interval: 15s
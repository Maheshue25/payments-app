apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: support-ai-agent-monitor
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  endpoints:
    - port: http
      path: {{ .Values.metrics.path | default "/agent/metrics" }}
      interval: {{ .Values.metrics.interval | default "15s" }}
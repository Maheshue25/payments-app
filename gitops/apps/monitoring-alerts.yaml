apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: payment-agentops-alerts
  namespace: monitoring
  labels:
    role: alert-rules
spec:
  groups:
    - name: agentops-health
      rules:
        - alert: AIAgentHighLatency
          expr: histogram_quantile(0.95, sum(rate(ai_agent_inference_duration_seconds_bucket[5m])) by (le)) > 5.0
          for: 2m
          labels:
            severity: warning
            tier: support-agent
          annotations:
            summary: "Support AI Agent P95 latency exceeds 5 seconds"
            description: "Agent inference is experiencing slowdowns, impacting customer support response times."

        - alert: AIAgentErrorRateSpike
          expr: (sum(rate(ai_agent_requests_total{status="error"}[5m])) / sum(rate(ai_agent_requests_total[5m]))) * 100 > 5.0
          for: 1m
          labels:
            severity: critical
            tier: support-agent
          annotations:
            summary: "Support AI Agent failure rate exceeded 5%"
            description: "Over 5% of customer support queries are failing Bedrock invocation or database diagnostics."
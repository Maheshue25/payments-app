apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: support-ai-agent
  namespace: argocd
  labels:
    tier: agentops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/Maheshue25/payments-app.git'
    targetRevision: main
    path: helm/support-ai-agent
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: payments
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
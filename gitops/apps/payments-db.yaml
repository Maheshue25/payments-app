# Language: YAML (gitops/apps/payments-db.yaml)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-db
  namespace: payments
  labels:
    app: payments-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-db
  template:
    metadata:
      labels:
        app: payments-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
            - name: POSTGRES_DB
              value: "finance_db"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: payments-db
  namespace: payments
spec:
  selector:
    app: payments-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
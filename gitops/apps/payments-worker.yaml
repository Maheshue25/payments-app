apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payments-worker
  namespace: argocd
  labels:
    tier: core-engine
spec:
  project: default
  source:
    repoURL: https://github.com/Maheshue25/payments-app.git
    targetRevision: main
    path: helm/payments-worker
  destination:
    server: https://kubernetes.default.svc
    namespace: payments
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true